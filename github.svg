<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" width="160" height="42">
  <defs>
    <filter id="glow-github" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .btn {
      transition: transform 0.2s ease-in-out;
      cursor: pointer;
    }
    .btn-bg {
      fill: #080c14;
      stroke: #1e293b;
      stroke-width: 1.5;
      transition: stroke 0.25s ease-in-out, fill 0.25s ease-in-out;
    }
    .btn-text {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
      transition: fill 0.25s ease-in-out;
    }
    .btn-icon {
      fill: #a0aec0;
      transition: fill 0.25s ease-in-out;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:hover .btn-bg {
      stroke: #ff007f;
      fill: #ff007f15;
    }
    .btn:hover .btn-text {
      fill: #ffffff;
    }
    .btn:hover .btn-icon {
      fill: #ff007f;
    }
  </style>
  <g class="btn">
    <!-- Pill Border and Background -->
    <rect class="btn-bg" width="158" height="40" x="1" y="1" rx="20" />
    
    <!-- GitHub Octocat Icon -->
    <g transform="translate(18, 11)" class="btn-icon">
      <path d="M10,0 C4.477,0 0,4.477 0,10 C0,14.418 2.865,18.166 6.839,19.489 C7.339,19.58 7.522,19.273 7.522,19.009 C7.522,18.771 7.513,18.14 7.509,17.305 C4.733,17.907 4.148,15.97 4.148,15.97 C3.695,14.818 3.04,14.512 3.04,14.512 C2.135,13.895 3.109,13.907 3.109,13.907 C4.11,13.978 4.637,14.939 4.637,14.939 C5.526,16.462 6.971,16.022 7.54,15.767 C7.63,15.123 7.888,14.685 8.172,14.437 C5.955,14.185 3.625,13.326 3.625,9.502 C3.625,8.413 4.014,7.522 4.653,6.824 C4.55,6.571 4.208,5.553 4.751,4.18 C4.751,4.18 5.588,3.912 7.494,5.2 C8.289,4.979 9.143,4.869 9.992,4.865 C10.841,4.869 11.696,4.979 12.492,5.2 C14.396,3.912 15.231,4.18 15.231,4.18 C15.776,5.553 16.434,6.571 16.332,6.824 C16.973,7.522 17.36,8.413 17.36,9.502 C17.36,13.336 15.027,14.181 12.802,14.429 C13.16,14.737 13.478,15.348 13.478,16.282 C13.478,17.625 13.466,18.71 13.466,19.034 C13.466,19.299 13.647,19.606 14.155,19.508 C18.125,18.161 20,14.416 20,10 C20,4.477 15.523,0 10,0 Z" />
    </g>
    
    <!-- Text -->
    <text x="76" y="25" class="btn-text" text-anchor="middle">GitHub</text>
  </g>
</svg>
