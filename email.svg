<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" width="160" height="42">
  <defs>
    <filter id="glow-email" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    .btn {
      transition: transform 0.2s ease-in-out;
      cursor: pointer;
    }
    .btn-bg {
      fill: #080c14;
      stroke: #1e293b;
      stroke-width: 1.5;
      transition: stroke 0.25s ease-in-out, fill 0.25s ease-in-out;
    }
    .btn-text {
      font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 13px;
      font-weight: 700;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
      transition: fill 0.25s ease-in-out;
    }
    .btn-icon {
      fill: #a0aec0;
      transition: fill 0.25s ease-in-out;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn:hover .btn-bg {
      stroke: #ea4335;
      fill: #ea433515;
    }
    .btn:hover .btn-text {
      fill: #ffffff;
    }
    .btn:hover .btn-icon {
      fill: #ea4335;
    }
  </style>
  <g class="btn">
    <!-- Pill Border and Background -->
    <rect class="btn-bg" width="158" height="40" x="1" y="1" rx="20" />
    
    <!-- Email Envelope Icon -->
    <g transform="translate(18, 11)" class="btn-icon">
      <path d="M18 4H2C0.9 4 0.01 4.9 0.01 6L0 16C0 17.1 0.9 18 2 18H18C19.1 18 20 17.1 20 16V6C20 4.9 19.1 4 18 4ZM18 8L10 13L2 8V6L10 11L18 6V8Z" />
    </g>
    
    <!-- Text -->
    <text x="76" y="25" class="btn-text" text-anchor="middle">Email</text>
  </g>
</svg>
