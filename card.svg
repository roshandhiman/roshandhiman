<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1020" width="950" height="1020">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="50%" stop-color="#111820" />
      <stop offset="100%" stop-color="#0a0e14" />
    </linearGradient>

    <filter id="matrix-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" />
    </filter>

    <filter id="green-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="img-shadow" x="-5%" y="-2%" width="110%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <!-- Clip the center image area -->
    <clipPath id="photo-clip">
      <rect x="305" y="110" width="340" height="810" rx="14" />
    </clipPath>
  </defs>

  <style>
    .title-main {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 800;
      font-size: 26px;
      fill: #f0f6fc;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
      fill: #00f0ff;
      letter-spacing: 0.5px;
    }
    .section-head {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      font-size: 14px;
      fill: #00f0ff;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .mono {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 13px;
    }
    .lbl { fill: #8b949e; font-weight: 600; }
    .val { fill: #c9d1d9; }
    .val-b { fill: #f0f6fc; font-weight: 600; }
    .mx {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      fill: #22c55e;
      opacity: 0.18;
    }
    .footer-text {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 14px;
      fill: #484f58;
      font-weight: 500;
    }

    /* Smooth fade-in for content */
    @keyframes revealContent {
      0%   { opacity: 0; }
      55%  { opacity: 0; }
      100% { opacity: 1; }
    }
    .content { animation: revealContent 2.4s ease forwards; }

    /* Door slide */
    @keyframes doorL {
      0%   { transform: translateX(0); }
      42%  { transform: translateX(0); }
      100% { transform: translateX(-476px); }
    }
    @keyframes doorR {
      0%   { transform: translateX(0); }
      42%  { transform: translateX(0); }
      100% { transform: translateX(476px); }
    }
    .door-l { animation: doorL 2.4s cubic-bezier(.77,0,.175,1) forwards; }
    .door-r { animation: doorR 2.4s cubic-bezier(.77,0,.175,1) forwards; }

    /* Hacker pulsing text on doors */
    @keyframes hackPulse {
      0%,100% { opacity: 0.6; fill: #22c55e; }
      50% { opacity: 1; fill: #4ade80; }
    }
    .hack-pulse {
      font-family: "SFMono-Regular", Consolas, monospace;
      font-weight: bold;
      animation: hackPulse 1s infinite;
    }
    @keyframes fadeOut {
      0%   { opacity: 1; }
      38%  { opacity: 1; }
      48%  { opacity: 0; }
      100% { opacity: 0; }
    }
    .door-fade { animation: fadeOut 2.4s ease forwards; }
  </style>

  <!-- Canvas -->
  <rect width="950" height="1020" rx="14" fill="url(#card-bg)" stroke="#21262d" stroke-width="1" />

