<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1020" width="950" height="1020">  <defs>    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">      <stop offset="0%" stop-color="#0a0e14" />      <stop offset="50%" stop-color="#111820" />      <stop offset="100%" stop-color="#0a0e14" />    </linearGradient>     <filter id="matrix-blur" x="-20%" y="-20%" width="140%" height="140%">      <feGaussianBlur stdDeviation="1.8" />    </filter>     <filter id="green-glow" x="-30%" y="-30%" width="160%" height="160%">      <feGaussianBlur stdDeviation="5" result="blur" />      <feMerge>        <feMergeNode in="blur" />        <feMergeNode in="SourceGraphic" />      </feMerge>    </filter>     <filter id="img-shadow" x="-5%" y="-2%" width="110%" height="108%">      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />    </filter>     <!-- Clip the center image area -->    <clipPath id="photo-clip">      <rect x="305" y="110" width="340" height="810" rx="14" />    </clipPath>  </defs>   <style>    .title-main {      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;      font-weight: 800;      font-size: 26px;      fill: #f0f6fc;      letter-spacing: 1px;    }    .subtitle {      font-family: "SFMono-Regular", Consolas, monospace;      font-size: 13px;      fill: #00f0ff;      letter-spacing: 0.5px;    }    .section-head {      font-family: -apple-system, BlinkMacSystemFont, sans-serif;      font-weight: 700;      font-size: 14px;      fill: #00f0ff;      letter-spacing: 1px;      text-transform: uppercase;    }    .mono {      font-family: "SFMono-Regular", Consolas, monospace;      font-size: 13px;    }    .lbl { fill: #8b949e; font-weight: 600; }    .val { fill: #c9d1d9; }    .val-b { fill: #f0f6fc; font-weight: 600; }
